# Qodana: JetBrains' IDE inspections (the IntelliJ/Android Studio equivalent of ReSharper) run headless.
# Workflow: .github/workflows/qodana.yml. Findings land in GitHub code scanning.
# Local run: `just qodana` (needs podman/docker).
version: "1.0"
image: jetbrains/qodana-jvm-android:2026.2
profile:
  name: qodana.recommended
projectJDK: "21"
# The image's SDK may predate compileSdk 37; fetch the platform when an sdkmanager exists
# (otherwise AGP downloads missing platforms itself).
# AGP 9 only enables unit tests for the tested (debug) build type, but the IDE's Gradle import
# Qodana runs creates Compose Preview tasks for release variants too, which need them; flip it
# for the analysis run only (the checkout is throwaway).
bootstrap: |
  printf '\nandroid.onlyEnableUnitTestForTheTestedBuildType=false\n' >> gradle.properties
  SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}"
  SDKMANAGER="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
  if [ -n "$SDKMANAGER" ] && [ ! -d "$SDK/platforms/android-37.0" ]; then
    yes | "$SDKMANAGER" "platforms;android-37.0" > /dev/null || true
  fi
  exit 0
exclude:
  - name: All
    paths:
      - app/src/main/baseline-prof.txt
      - benchmark
